<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Thread Stepper - WebGL 8</title>
    <script src="three.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        position: relative;
      }
      #watermark {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        opacity: 0.3;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <script>
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      camera.position.set(0, 0, 0);
      camera.lookAt(0, 0, 10);

      const count = 8000;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);

      for (let i = 0; i < count; i++) {
        const z = (Math.random() - 0.5) * 400;
        const angle = Math.random() * Math.PI * 2;
        const radius = 8 + (Math.random() - 0.5) * 3;
        positions[i * 3] = Math.cos(angle) * radius;
        positions[i * 3 + 1] = Math.sin(angle) * radius;
        positions[i * 3 + 2] = z;
        const c = new THREE.Color();
        c.setHSL((z + 200) / 400, 1, 0.7);
        colors[i * 3] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
      const mat = new THREE.PointsMaterial({ size: 0.3, vertexColors: true });
      const pts = new THREE.Points(geo, mat);
      scene.add(pts);

      let t = 0;
      function animate() {
        requestAnimationFrame(animate);
        t += 0.016;
        camera.position.z -= 1.2;
        if (camera.position.z < -200) camera.position.z = 200;
        pts.rotation.z += 0.003;
        camera.lookAt(camera.position.x, camera.position.y, camera.position.z - 10);
        renderer.render(scene, camera);
      }
      animate();
    </script>
    <img id="watermark" src="logo.png" alt="Watermark" width="200" />
  </body>
</html>
