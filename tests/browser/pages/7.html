<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ThreadStepper 7</title>
    <script src="three.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        position: relative;
      }
      #watermark {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        opacity: 0.3;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <script>
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      camera.position.set(0, 40, 80);
      camera.lookAt(0, 0, 0);

      const arms = 4,
        count = 15000;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const c1 = new THREE.Color(),
        c2 = new THREE.Color();

      for (let i = 0; i < count; i++) {
        const arm = (i % arms) * ((Math.PI * 2) / arms);
        const r = Math.random() * 60 + 1;
        const spin = r * 0.3;
        const spread = (Math.random() - 0.5) * (r * 0.2);
        const theta = arm + spin + spread;
        positions[i * 3] = Math.cos(theta) * r + (Math.random() - 0.5) * 3;
        positions[i * 3 + 1] = (Math.random() - 0.5) * 4;
        positions[i * 3 + 2] = Math.sin(theta) * r + (Math.random() - 0.5) * 3;
        const mix = r / 60;
        c1.setHSL(0.6 + mix * 0.2, 1, 0.8);
        c2.setHSL(0.05, 1, 0.9);
        const col = new THREE.Color().copy(c1).lerp(c2, mix);
        colors[i * 3] = col.r;
        colors[i * 3 + 1] = col.g;
        colors[i * 3 + 2] = col.b;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
      const mat = new THREE.PointsMaterial({ size: 0.4, vertexColors: true, transparent: true, opacity: 0.85 });
      const pts = new THREE.Points(geo, mat);
      scene.add(pts);

      let t = 0;
      function animate() {
        requestAnimationFrame(animate);
        t += 0.016;
        pts.rotation.y += 0.002;
        camera.position.y = Math.sin(t * 0.3) * 20 + 30;
        camera.lookAt(0, 0, 0);
        renderer.render(scene, camera);
      }
      animate();
    </script>
    <img id="watermark" src="logo.png" alt="Watermark" width="200" />
  </body>
</html>
